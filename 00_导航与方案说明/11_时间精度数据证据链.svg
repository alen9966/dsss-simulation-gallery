<text x="78" y="773" font-family="Microsoft YaHei,Arial" font-size="16" fill="#6a7e91">证据等级：代码事实 ＞ 由常数可复算 ＞ RTL分段仿真 ＞ 功能模型/假设 ＞ 待硬件或ARM闭环确认</text>
